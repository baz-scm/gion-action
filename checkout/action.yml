name: gion checkout
description: Check out only the directories a job needs, at the exact commit under test.
author: baz-scm
branding:
  icon: download
  color: blue

inputs:
  repository:
    description: owner/repo or a git URL.
    default: ${{ github.repository }}
  ref:
    description: >
      Branch, tag or commit to check out. Defaults to the commit under test
      for this repository, and to the remote's HEAD for any other.
    default: ""
  paths:
    description: >
      Paths to check out, one per line. Files in their parent directories
      (root config, lockfiles) come along. Empty checks out everything.
    default: ""
  projects:
    description: >
      Projects from the repo's .gion/projects.toml to check out, one per
      line. Their local dependencies come along. Combines with paths.
    default: ""
  path:
    description: Directory to put the workspace in, relative to $GITHUB_WORKSPACE.
    default: .
  git:
    description: '"false" skips the local .git snapshot (git status, git diff and pre-commit need it).'
    default: "true"
  token:
    description: Token for github.com, exported as GITHUB_TOKEN to later steps. Empty to export nothing.
    default: ${{ github.token }}
  version:
    description: >
      gion release to install, e.g. v0.3.1, or "latest". Defaults to the
      release this version of the action was tested with, which skips a
      lookup. It is bumped after each gion release.
    default: v0.6.0

outputs:
  path:
    description: Directory the workspace was put in.
    value: ${{ steps.clone.outputs.path }}
  gion-version:
    description: The gion version installed.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        GION_VERSION: ${{ inputs.version }}
      run: '"$GITHUB_ACTION_PATH/../scripts/install.sh"'
    - if: inputs.token != ''
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: echo "GITHUB_TOKEN=$TOKEN" >>"$GITHUB_ENV"
    - id: clone
      shell: bash
      env:
        GION: ${{ steps.install.outputs.path }}
        GITHUB_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        REF: ${{ inputs.ref || (inputs.repository == github.repository && github.sha || '') }}
        PATHS: ${{ inputs.paths }}
        PROJECTS: ${{ inputs.projects }}
        DIR: ${{ inputs.path }}
        GIT: ${{ inputs.git }}
      run: '"$GITHUB_ACTION_PATH/../scripts/checkout.sh"'
